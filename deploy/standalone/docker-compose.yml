# ============================================================
# HubForge - Standalone 部署
# 单机全量：PostgreSQL + Portal + Nginx (HTTP + HTTPS)
# 启动: docker compose up -d
# ============================================================

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: hubforge-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hubforge}
      POSTGRES_USER: ${POSTGRES_USER:-hubforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../03-开发/prisma/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hubforge} -d ${POSTGRES_DB:-hubforge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HubForge Portal 应用
  portal:
    build:
      context: ../../03-开发
      dockerfile: Dockerfile
    image: hubforge-portal:latest
    container_name: hubforge-portal
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-hubforge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hubforge}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_NAME: ${COOKIE_NAME:-hubforge-token}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://localhost}
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Nginx 反向代理（HTTP + HTTPS）
  nginx:
    image: nginx:1.27-alpine
    container_name: hubforge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - portal

volumes:
  postgres_data:

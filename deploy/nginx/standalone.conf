# ============================================================
# HubForge - Nginx Standalone 配置
# 单机模式：反向代理 + 多应用路由
# /app/portal/ → Portal (port 3000)
# /app/xxx/    → 其他服务（按需添加）
# ============================================================

upstream hubforge_portal {
    server portal:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # --- HubForge Portal ---
    location /app/portal/ {
        proxy_pass http://hubforge_portal/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # --- HubForge Portal WebSocket（如有）---
    location /app/portal/_next/webpack-hmr {
        proxy_pass http://hubforge_portal/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- 其他应用示例（按需启用）---
    # location /app/appname/ {
    #     proxy_pass http://appname:PORT/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # --- 默认路由（可改为首页或 404）---
    location / {
        return 302 /app/portal/;
    }
}

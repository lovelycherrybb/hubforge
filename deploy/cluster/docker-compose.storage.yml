# ============================================================
# HubForge - Cluster 部署：MinIO 对象存储
# 启动: docker compose -f docker-compose.storage.yml up -d
# 控制台: http://localhost:${MINIO_CONSOLE_PORT:-9001}
# ============================================================

version: "3.9"

services:
  minio:
    image: minio/minio:latest
    container_name: hubforge-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请设置 MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  minio_data:

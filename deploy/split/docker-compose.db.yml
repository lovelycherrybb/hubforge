# ============================================================
# HubForge - Split 部署：数据库服务器
# 独立数据库服务器，仅运行 PostgreSQL
# 启动: docker compose -f docker-compose.db.yml up -d
# ============================================================

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hubforge-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hubforge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hubforge}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

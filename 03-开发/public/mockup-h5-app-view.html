<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HubForge H5 应用视图 - 方案C</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Helvetica Neue", sans-serif; background: #000; display: flex; justify-content: center; padding: 20px; }
    
    /* 手机外框 */
    .phone {
      width: 375px;
      height: 812px;
      background: #f5f5f5;
      border-radius: 40px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 0 3px #333, 0 0 0 6px #1a1a2e, 0 20px 60px rgba(0,0,0,0.5);
    }
    
    /* 状态栏 */
    .status-bar {
      height: 44px;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }
    .status-bar .time { font-size: 14px; font-weight: 700; }
    
    /* HubForge 顶部栏 */
    .hubforge-bar {
      height: 48px;
      background: white;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid #e5e5e5;
      gap: 8px;
    }
    .hubforge-bar .back {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1a2e;
      cursor: pointer;
    }
    .hubforge-bar .back svg { width: 20px; height: 20px; }
    .hubforge-bar .logo {
      width: 24px;
      height: 24px;
      background: #1a1a2e;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 11px;
      font-weight: 700;
    }
    .hubforge-bar .app-name {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      flex: 1;
    }
    .hubforge-bar .close {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      cursor: pointer;
    }
    
    /* 应用内容区 */
    .app-content {
      height: calc(812px - 44px - 48px);
      overflow-y: auto;
      background: linear-gradient(180deg, #1e5aa8 0%, #2a6fc0 40%, #f5f5f5 40%);
    }
    
    /* 应用内部 - 蓝色头部 */
    .app-header {
      padding: 20px 16px 24px;
      color: white;
    }
    .app-header h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .app-header p {
      font-size: 13px;
      opacity: 0.8;
    }
    
    /* 统计卡片 */
    .stats {
      display: flex;
      gap: 8px;
      padding: 0 16px;
      margin-top: -16px;
      position: relative;
      z-index: 1;
    }
    .stat-card {
      flex: 1;
      background: white;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .stat-card .num { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
    .stat-card .num.blue { color: #1e5aa8; }
    .stat-card .num.orange { color: #e67e22; }
    .stat-card .num.green { color: #27ae60; }
    .stat-card .label { font-size: 11px; color: #999; }
    
    /* 拍照卡片 */
    .camera-card {
      margin: 16px;
      background: white;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .camera-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border: 2px dashed #1e5aa8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .camera-icon::before {
      content: '';
      width: 44px;
      height: 44px;
      background: #e8f0fe;
      border-radius: 50%;
      position: absolute;
    }
    .camera-icon svg {
      position: relative;
      z-index: 1;
      width: 24px;
      height: 24px;
      color: #1e5aa8;
    }
    .camera-card .title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 4px; }
    .camera-card .desc { font-size: 12px; color: #999; }
    
    /* 输入卡片 */
    .input-card {
      margin: 0 16px 10px;
      background: white;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .input-card .icon-box {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .input-card .icon-box.blue { background: #e8f0fe; }
    .input-card .icon-box.yellow { background: #fef7e0; }
    .input-card .icon-box svg { width: 18px; height: 18px; }
    .input-card .text .title { font-size: 14px; font-weight: 500; color: #333; }
    .input-card .text .placeholder { font-size: 12px; color: #bbb; margin-top: 2px; }
    
    /* 按钮 */
    .action-btn {
      margin: 16px;
      background: linear-gradient(135deg, #1e5aa8, #4a7fd4);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      color: white;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(30,90,168,0.3);
    }
    .action-btn::after { content: ' →'; }
    
    /* 应用底部导航 */
    .app-bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: white;
      border-top: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .app-bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .app-bottom-nav .nav-item.active { color: #1e5aa8; }
    .app-bottom-nav .nav-item.inactive { color: #999; }
    .app-bottom-nav .nav-item svg { width: 22px; height: 22px; }
    .app-bottom-nav .nav-item span { font-size: 10px; }
    
    /* 标注 */
    .annotation {
      position: absolute;
      right: -240px;
      font-size: 12px;
      color: #666;
      background: white;
      padding: 6px 10px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      white-space: nowrap;
    }
    .annotation::before {
      content: '';
      position: absolute;
      left: -8px;
      top: 50%;
      transform: translateY(-50%);
      border: 4px solid transparent;
      border-right-color: white;
    }
    .annotation.top-bar { top: 68px; }
    .annotation.app-nav { bottom: 80px; }
    .annotation.app-content { top: 260px; }
    
    /* 标题 */
    .page-title {
      color: white;
      text-align: center;
      margin-bottom: 16px;
      font-size: 14px;
      opacity: 0.7;
    }
    .page-title h2 { font-size: 20px; opacity: 1; margin-bottom: 4px; color: white; }
  </style>
</head>
<body>
  <div>
    <div class="page-title">
      <h2>方案C：应用全屏 + 顶部返回栏</h2>
      H5 进入应用后的布局效果
    </div>
    
    <div class="phone">
      <!-- iOS 状态栏 -->
      <div class="status-bar">
        <span class="time">11:38</span>
        <span>●●● WiFi 100%</span>
      </div>
      
      <!-- HubForge 顶部栏 (48px) -->
      <div class="hubforge-bar">
        <div class="back" title="返回上一步">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </div>
        <div class="logo">H</div>
        <div class="app-name">VC 安全巡检</div>
        <div class="close" title="关闭应用，退出到进入前的页面">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18" height="18">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </div>
      </div>
      
      <!-- 应用内容区（占满剩余空间） -->
      <div class="app-content">
        <!-- 应用蓝色头部 -->
        <div class="app-header">
          <h1>安全隐患巡检</h1>
          <p>AI 智能识别 · 守护安全</p>
        </div>
        
        <!-- 统计卡片 -->
        <div class="stats">
          <div class="stat-card">
            <div class="num blue">12</div>
            <div class="label">今日巡检</div>
          </div>
          <div class="stat-card">
            <div class="num orange">3</div>
            <div class="label">待处理</div>
          </div>
          <div class="stat-card">
            <div class="num green">48</div>
            <div class="label">已完成</div>
          </div>
        </div>
        
        <!-- 拍照卡片 -->
        <div class="camera-card">
          <div class="camera-icon">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
              <circle cx="12" cy="13" r="3"/>
            </svg>
          </div>
          <div class="title">点击拍照或选择图片</div>
          <div class="desc">支持现场拍照、相册选取</div>
        </div>
        
        <!-- 输入卡片 -->
        <div class="input-card">
          <div class="icon-box blue">
            <svg fill="none" stroke="#1e5aa8" stroke-width="2" viewBox="0 0 24 24">
              <path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              <path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </div>
          <div class="text">
            <div class="title">巡检位置</div>
            <div class="placeholder">如：A栋3层施工现场</div>
          </div>
        </div>
        
        <div class="input-card">
          <div class="icon-box yellow">
            <svg fill="none" stroke="#d4a017" stroke-width="2" viewBox="0 0 24 24">
              <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
          </div>
          <div class="text">
            <div class="title">场景描述</div>
            <div class="placeholder">描述巡检场景（支持语音输入）</div>
          </div>
        </div>
        
        <!-- 操作按钮 -->
        <div class="action-btn">开始分析</div>
        
        <!-- 底部留白（给应用底栏） -->
        <div style="height: 60px;"></div>
      </div>
      
      <!-- 应用自己的底部导航 -->
      <div class="app-bottom-nav">
        <div class="nav-item active">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
            <circle cx="12" cy="13" r="3"/>
          </svg>
          <span>拍照</span>
        </div>
        <div class="nav-item inactive">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <span>记录</span>
        </div>
        <div class="nav-item inactive">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
          <span>看板</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
